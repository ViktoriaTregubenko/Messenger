<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
<div class="logo">
    <img src="/logo.png" alt="Victory" class="logo-img">
    <span class="logo-text">Victory</span>
</div>
                <h2>Добро пожаловать</h2>
                <p>Войдите в свой аккаунт</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Имя пользователя или Email</label>
                    <input type="text" id="username" name="username" placeholder="ivan123 или ivan@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            
                
                <button type="submit" class="btn btn-primary btn-block">Войти</button>
                
                
                <div class="auth-footer">
                    <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                </div>
            </form>
            
            <div id="errorMessage" class="error-message" style="display:none;"></div>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
