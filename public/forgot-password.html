<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<meta name="theme-color" content="#FF6B9D">
<link rel="manifest" href="/manifest.json">
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Восстановление пароля</h2>
            <p>Введите ваш email, и мы отправим ссылку для сброса пароля</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Отправить</button>
                <div id="message" style="margin-top: 1rem; text-align: center;"></div>
                <div class="auth-footer">
                    <p><a href="login.html">Вернуться ко входу</a></p>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msg = document.getElementById('message');
            
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                msg.textContent = data.message || 'Письмо отправлено, проверьте почту';
                msg.style.color = '#2ecc71';
            } catch {
                msg.textContent = 'Ошибка соединения с сервером';
                msg.style.color = '#e74c3c';
            }
        });
    </script>
</body>
</html>
