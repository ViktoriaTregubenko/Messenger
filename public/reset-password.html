<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<meta name="theme-color" content="#FF6B9D">
<link rel="manifest" href="/manifest.json">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Сброс пароля</h2>
            <p>Введите новый пароль</p>
            <form id="resetForm">
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Сбросить пароль</button>
                <div id="message" style="margin-top: 1rem; text-align: center;"></div>
            </form>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('message').textContent = 'Токен не найден';
            document.getElementById('message').style.color = '#e74c3c';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('message');

            if (password !== confirm) {
                msg.textContent = 'Пароли не совпадают';
                msg.style.color = '#e74c3c';
                return;
            }
            if (password.length < 6) {
                msg.textContent = 'Пароль должен быть минимум 6 символов';
                msg.style.color = '#e74c3c';
                return;
            }

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: password })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = 'Пароль успешно сброшен!';
                    msg.style.color = '#2ecc71';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    msg.textContent = data.error || 'Ошибка';
                    msg.style.color = '#e74c3c';
                }
            } catch {
                msg.textContent = 'Ошибка соединения с сервером';
                msg.style.color = '#e74c3c';
            }
        });
    </script>
</body>
</html>
