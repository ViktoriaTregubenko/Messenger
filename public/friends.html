<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- МЕНЮ -->
    <div class="profile-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="/logo.png" alt="Victory" class="logo-img">
                <span class="logo-text">Victory</span>
            </div>
        </div>
        <div class="nav-center">
            <button class="theme-toggle" id="themeToggle">🌓</button>
            <a href="dashboard.html">Профиль</a>
            <a href="friends.html">Друзья</a>
            <a href="rooms.html">Комнаты</a>
            <a href="messages.html">Личные сообщения</a>
            <a href="profile.html">Настройки</a>
            <a href="#" id="logoutBtn">Выйти</a>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="dashboard-container">
        <div class="dashboard-grid">

            <!-- ЛЕВАЯ ПАНЕЛЬ — ПОИСК -->
            <div class="card" style="padding: 1rem;">
                <h3 style="margin-bottom: 0.5rem;">🔍 Поиск</h3>
                <input type="text" id="globalSearchInput" placeholder="Имя пользователя..." class="form-control">
                <div id="searchResults" style="margin-top:0.5rem; max-height:300px; overflow-y:auto;"></div>
            </div>

            <!-- ПРАВАЯ ПАНЕЛЬ — СПИСОК ДРУЗЕЙ -->
            <div>
                <div class="page-header">
                    <h2><img src="/fast.png" alt="Дизайн" class="feature-icon"> Друзья</h2>
                    <button id="showRequestsBtn" class="btn btn-outline" style="padding: 0.5rem 1rem;">
                        Заявки (<span id="requestsCount">0</span>)
                    </button>
                </div>
                <div class="card" style="padding: 1.2rem;">
                    <div id="friendsList" class="list-container">
                        <div style="text-align: center; padding: 2rem;">Загрузка...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Модальное окно заявок -->
    <div id="requestsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Входящие заявки</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div id="requestsList"></div>
        </div>
    </div>

    <!-- Модальное окно просмотра профиля друга -->
    <div id="userProfileModal" class="modal" style="display:none">
        <div class="modal-content user-profile-modal">
            <span class="close-modal">&times;</span>
            <div class="user-profile-view">
                <div class="user-profile-header">
                    <img id="viewUserAvatar" src="https://via.placeholder.com/80" alt="Avatar">
                    <div>
                        <h2 id="viewUserFullName"></h2>
                        <p class="view-username">@<span id="viewUserUsername"></span></p>
                        <p class="view-status" id="viewUserStatus"></p>
                    </div>
                </div>
                <div class="user-profile-details">
                    <div class="detail-row"><strong> Дата рождения:</strong> <span id="viewUserBirthDate">Не указана</span></div>
                    <div class="detail-row"><strong> Город:</strong> <span id="viewUserCity">Не указан</span></div>
                    <div class="detail-row"><strong> О себе:</strong> <span id="viewUserBio">Не указано</span></div>
                </div>
                <button id="sendMessageToUserBtn" class="primary-btn">Написать сообщение</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ -->
    <div id="confirmModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="confirmTitle">Подтверждение</h3>
                <span class="close-modal" id="closeConfirmModal">&times;</span>
            </div>
            <p id="confirmMessage" style="margin: 1rem 0; font-size: 1.1rem;">Вы уверены?</p>
            <div style="display: flex; gap: 0.8rem; margin-top: 0.5rem;">
                <button id="confirmYesBtn" class="btn btn-danger" style="flex:1;">✅ Да</button>
                <button id="confirmNoBtn" class="btn btn-outline" style="flex:1;">❌ Нет</button>
            </div>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="friends.js"></script>
    <script src="theme.js"></script>
</body>
</html>
