<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
 <!-- МЕНЮ -->
    <div class="profile-sidebar">
        <div class="sidebar-header">
<div class="logo">
    <img src="/logo.png" alt="Victory" class="logo-img">
    <span class="logo-text">Victory</span>
</div>
        </div>

        <div class="nav-center">
             <button class="theme-toggle" id="themeToggle">🌓</button>
                <a href="dashboard.html">Профиль</a>
                <a href="friends.html">Друзья</a>
                <a href="rooms.html">Комнаты</a>
                <a href="messages.html">Личные сообщения</a>
                <a href="profile.html">Настройки</a>
                <a href="#" id="logoutBtn">Выйти</a>
        </div> 
    </div>

    <div class="dashboard-container">
        <div class="dashboard-grid">
            <!-- Сайдбар -->
            <div class="card">
                <div class="sidebar-profile">
                    <img id="avatar" src="https://via.placeholder.com/80" alt="avatar" class="sidebar-avatar">
                    <h3 id="fullName">Загрузка...</h3>
                    <p id="username">@username</p>
                </div>
            </div>

            <!-- Основной контент -->
            <div>
                <h1 style="margin-bottom: 1.5rem;">Здравствуйте, <span id="welcomeName">...</span>!</h1>

                <div class="search-section" style="margin-bottom: 1.5rem;">
    <input type="text" id="globalSearch" placeholder="Поиск..." style="width:100%; padding:0.8rem 1.2rem; border-radius:50px; border:2px solid var(--pink); font-size:1rem;">
    <div id="searchResults" style="margin-top: 1rem; display:none;"></div>
</div>
                
                <div class="stats-grid">
                    <h3 style="margin-bottom: 1rem;">У Вас:</h3>
                    <div class="stat-card">
                        <div class="stat-value" id="friendsCount">0</div>
                        <div class="stat-label">Друзей</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="roomsCount">0</div>
                        <div class="stat-label">Комнат</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="onlineCount">0</div>
                        <div class="stat-label">В сети</div>
                    </div>
                    
                </div>

                <div class="card" style="display: flex; align-items: center; gap: 2rem; padding: 1.5rem;">
                    <img src="logo.png" 
                         alt="Welcome illustration" 
                         style="width: 120px; height: 120px; object-fit: contain; flex-shrink: 0;">
                    <div style="text-align: left; color: inherit;">
                        <p style="font-size: 1.2rem; font-weight: 500;">Добро пожаловать в Victory!</p>
                        <p style="margin-top: 0.5rem; opacity: 0.8;">Общайтесь с друзьями, создавайте комнаты и делитесь впечатлениями!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="dashboard.js"></script>
    <script src="theme.js"></script>
</body>
</html>
