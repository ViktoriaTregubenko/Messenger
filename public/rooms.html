<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комнаты - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- МЕНЮ -->
    <div class="profile-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="/logo.png" alt="Victory" class="logo-img">
                <span class="logo-text">Victory</span>
            </div>
        </div>
        <div class="nav-center">
            <button class="theme-toggle" id="themeToggle">🌓</button>
            <a href="dashboard.html">Профиль</a>
            <a href="friends.html">Друзья</a>
            <a href="rooms.html">Комнаты</a>
            <a href="messages.html">Личные сообщения</a>
            <a href="profile.html">Настройки</a>
            <a href="#" id="logoutBtn">Выйти</a>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="dashboard-container">
        <div class="dashboard-grid">

            <!-- ЛЕВАЯ ПАНЕЛЬ — ПОИСК -->
            <div class="card" style="padding: 1rem;">
                <h3 style="margin-bottom: 0.5rem;">🔍 Поиск</h3>
                <input type="text" id="roomsSearchInput"
                       placeholder="Название или описание комнаты..."
                       class="form-control">
                <div id="roomsSearchHint" class="search-hint">
                </div>
            </div>

            <!-- ПРАВАЯ ПАНЕЛЬ — СПИСОК КОМНАТ -->
            <div>
                <div class="page-header">
                    <h2><img src="/fast.png" alt="Дизайн" class="feature-icon"> Комнаты</h2>
                    <div class="page-header-actions">
                        <span class="page-header-counter"> <span id="roomsCount">0</span></span>
                        <button class="btn btn-primary" id="createRoomBtn" style="padding: 0.5rem 1rem;">+ Создать</button>
                    </div>
                </div>
                <div class="card" style="padding: 1.2rem;">
                    <div id="roomsList" class="rooms-list">
                        <div style="text-align:center; padding:2rem; color:var(--facebook-gray);">Загрузка...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Модалка создания комнаты -->
    <div id="createRoomModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создать комнату</h3>
                <button class="modal-close" id="closeCreateRoom">&times;</button>
            </div>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="roomName" class="form-control" placeholder="Название комнаты">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="roomDescription" class="form-control" rows="3" placeholder="Описание комнаты"></textarea>
            </div>
            <button class="btn btn-primary" id="confirmCreateRoom" style="width:100%;">Создать</button>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="rooms.js"></script>
    <script src="theme.js"></script>
</body>
</html>
