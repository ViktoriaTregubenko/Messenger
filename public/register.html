<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
<div class="logo">
    <img src="/logo.png" alt="Victory" class="logo-img">
    <span class="logo-text">Victory</span>
</div>
                <h2>Создайте аккаунт</h2>
                <p>Присоединяйтесь к общению в реальном времени!</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="full_name">Ваше имя</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Ваше имя или никнейм, который будет виден пользователям" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" placeholder="Придумайте уникальное имя пользователя" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Электронная почта" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Подтверждение пароля</label>
                    <input type="password" id="confirm_password" placeholder="Повторите пароль" required>
                </div>
                
                
                <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                
                <div class="auth-footer">
                    <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
                </div>
            </form>
            
            <div id="errorMessage" class="error-message" style="display:none;"></div>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
