<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные сообщения - Victory</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- МЕНЮ -->
    <div class="profile-sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="/logo.png" alt="Victory" class="logo-img">
                <span class="logo-text">Victory</span>
            </div>
        </div>
        <div class="nav-center">
            <button class="theme-toggle" id="themeToggle">🌓</button>
            <a href="dashboard.html">Профиль</a>
            <a href="friends.html">Друзья</a>
            <a href="rooms.html">Комнаты</a>
            <a href="messages.html">Личные сообщения</a>
            <a href="profile.html">Настройки</a>
            <a href="#" id="logoutBtn">Выйти</a>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="dashboard-container">
        <div class="dashboard-grid">

            <!-- ЛЕВАЯ ПАНЕЛЬ — ПОИСК -->
            <div class="card" style="padding: 1rem;">
                <h3 style="margin-bottom: 0.5rem;">🔍 Поиск</h3>
                <input type="text" id="messagesSearchInput"
                       placeholder="Введите текст..."
                       class="form-control">
                <div id="searchHint" class="search-hint">
                </div>
            </div>

            <!-- ПРАВАЯ ПАНЕЛЬ — СПИСОК ЧАТОВ -->
            <div>
                <div class="page-header">
                    <h2><img src="/fast.png" alt="Дизайн" class="feature-icon"> Личные сообщения</h2>
                    <button id="unreadBtn" class="btn btn-outline" style="padding: 0.5rem 1rem;">
                        Новые (<span id="unreadCount">0</span>)
                    </button>
                </div>
                <div class="card" style="padding: 1.2rem;">
                    <div id="chatsList" class="chats-list">
                        <div style="text-align:center; padding:2rem; color:var(--facebook-gray);">Загрузка...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="messages.js"></script>
    <script src="theme.js"></script>
</body>
</html>
